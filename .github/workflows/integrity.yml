name: Integrity & E2E Verification Gate

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-integrity:
    name: Backend Tests & Real PostgreSQL Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pettravel_test
        ports:
          - 5439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Verify Python Dependency Consistency & Vulnerabilities
        run: |
          python -m pip check
          python -m pip_audit -r backend/requirements.txt

      - name: Compile Backend Sources
        run: python -m compileall -q backend/app

      - name: Run Backend Pytest Suite (Unit, Adversarial, Migrations & Concurrency)
        env:
          POSTGRES_TEST_HOST: 127.0.0.1
          POSTGRES_TEST_PORT: 5439
          POSTGRES_TEST_USER: postgres
          POSTGRES_TEST_PASS: postgres
          VIETQR_WEBHOOK_SECRET: test-secret
          PAYMENT_SYSTEM_ACTOR_ID: admin_ops
        run: |
          pytest backend/tests/ -v

  frontend-integrity:
    name: Frontend Tests, Type-Check & Lint Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check
        working-directory: frontend
        run: npm run type-check

      - name: Run Frontend Tests (Node test runner)
        working-directory: frontend
        run: npm test

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Audit Frontend Production Dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
